name: Build (Windows-ORT)

on:
  push:
    branches:
      - '**'
    paths:
      - 'common/**'
      - 'vsort/**'
      - '.github/workflows/windows-ort.yml'
      - 'tools/regression_native_api4.py'
  workflow_call:
    inputs:
      tag:
        description: 'which tag to upload to'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'which tag to upload to'
        default: ''

jobs:
  build-windows:
    runs-on: windows-2025

    defaults:
      run:
        shell: cmd
        working-directory: vsort

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Ninja
      run: python -m pip install ninja

    - name: Restore cached onnx
      id: cache-onnx
      uses: actions/cache/restore@v4
      with:
        path: vsort/onnx/install
        key: ${{ runner.os }}-vsort-onnx-v6

    - name: Checkout onnx
      if: steps.cache-onnx.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: onnx/onnx
        # follows onnx in https://github.com/AmusementClub/onnxruntime/tree/master/cmake/external
        # if you change this, remember to bump the version of the cache key.
        ref: v1.19.0
        fetch-depth: 1
        path: vsort/onnx

    - name: Configure onnx
      if: steps.cache-onnx.outputs.cache-hit != 'true'
      run: cmake -S onnx -B onnx\build -G Ninja -LA
        -D CMAKE_BUILD_TYPE=Release
        -D CMAKE_PREFIX_PATH=%cd%\protobuf\install\lib\cmake
        -D ONNX_USE_LITE_PROTO=ON -D ONNX_USE_PROTOBUF_SHARED_LIBS=OFF
        -D ONNX_GEN_PB_TYPE_STUBS=OFF -D ONNX_ML=0
        -D ONNX_USE_MSVC_STATIC_RUNTIME=1
        -D ONNX_BUILD_CUSTOM_PROTOBUF=ON

    - name: Build onnx
      if: steps.cache-onnx.outputs.cache-hit != 'true'
      run: cmake --build onnx\build --verbose

    - name: Install onnx
      if: steps.cache-onnx.outputs.cache-hit != 'true'
      run: cmake --install onnx\build --prefix onnx\install

    - name: Save onnx
      if: steps.cache-onnx.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: vsort/onnx/install
        key: ${{ steps.cache-onnx.outputs.cache-primary-key }}

    - name: Download VapourSynth R77 headers
      run: |
        curl -fSL -o vs.zip https://github.com/vapoursynth/vapoursynth/archive/refs/tags/R77.zip
        unzip -q vs.zip
        mv vapoursynth-*/ vapoursynth/

    - name: Download ONNX Runtime Precompilation
      run: |
        curl -s -o ortgpu.zip -LJO https://github.com/AmusementClub/onnxruntime/releases/download/orttraining_rc2-10525-gecb26fb775-250906-0716/onnxruntime-gpu-win64.zip
        unzip -q ortgpu.zip

    - name: Restore cached CUDA
      id: cache-cuda
      uses: actions/cache/restore@v4
      with:
        path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
        key: ${{ runner.os }}-cuda-13.0.1

    - name: Setup CUDA
      if: steps.cache-cuda.outputs.cache-hit != 'true'
      run: |
        curl -s -o cuda_installer.exe -L https://developer.download.nvidia.com/compute/cuda/13.0.1/network_installers/cuda_13.0.1_windows_network.exe
        cuda_installer.exe -s nvcc_13.0 cudart_13.0 crt_13.0 nvptxcompiler_13.0

    - name: Save CUDA
      if: steps.cache-cuda.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
        key: ${{ steps.cache-cuda.outputs.cache-primary-key }}

    - name: Configure
      run: cmake -S . -B build -G Ninja -LA
        -D CMAKE_BUILD_TYPE=Release
        -D CMAKE_PREFIX_PATH=onnx\install
        -D CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
        -D VAPOURSYNTH_INCLUDE_DIRECTORY=vapoursynth\include
        -D ONNX_RUNTIME_API_DIRECTORY=onnxruntime-gpu\include\onnxruntime
        -D ONNX_RUNTIME_LIB_DIRECTORY=onnxruntime-gpu\lib
        -D ENABLE_CUDA=1
        -D CUDAToolkit_ROOT="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.0"
        -D ENABLE_DML=1
        -D CMAKE_CXX_STANDARD=20

    - name: Build
      run: cmake --build build --verbose

    - name: Install
      run: |
        cmake --install build --prefix install
        mkdir artifact
        mkdir artifact\vsort
        copy install\bin\vsort.dll artifact\
        copy onnxruntime-gpu\bin\*.dll artifact\vsort\
        copy onnxruntime-gpu\lib\*.dll artifact\vsort\

    - name: Download DirectML Library
      # follows DirectML in https://github.com/AmusementClub/onnxruntime/blob/master/cmake/external/dml.cmake#L44
      run: |
        curl -s -o directml.nupkg -LJO https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4
        unzip -q directml.nupkg -d dml
        copy dml\bin\x64-win\DirectML.dll artifact\vsort\

    - name: Describe
      run: git describe --tags --long

    - name: Dump dependencies
      run: dumpbin /dependents artifact\vsort.dll

    - name: Install R77 test runtime
      run: |
        python -m pip install --only-binary=:all: VapourSynth==77 numpy onnx==1.19.0

    - name: Verify API4 ownership and CPU inference
      run: python ../tools/regression_native_api4.py
        --plugin artifact/vsort.dll --namespace ort --exercise-ort
        --dll-dir artifact/vsort --output verification/ort-api4.json

    - name: Upload regression report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: VSORT-Windows-x64-verification
        path: vsort/verification/ort-api4.json
        if-no-files-found: warn

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: VSORT-Windows-x64
        path: vsort/artifact

    - name: Upload failed runtime artifact for diagnosis
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: VSORT-Windows-x64-failed-diagnostic
        path: vsort/artifact
        if-no-files-found: ignore

    - name: Compress artifact for release
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
      run: |
        cd artifact
        7z a -t7z -mx=7 ../../VSORT-Windows-x64.${{ github.event.inputs.tag }}.7z .

    - name: Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
      with:
        tag_name: ${{ inputs.tag }}
        files: VSORT-Windows-x64.${{ github.event.inputs.tag }}.7z
        fail_on_unmatched_files: true
        generate_release_notes: false
        prerelease: true
